# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy ASP.Net Core app to Azure Web App: minigram-api-emma'

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '10.x'

    - name: Restore
      run: dotnet restore ./backend/MinGramApi.csproj

    - name: Build
      run: dotnet build ./backend/MinGramApi.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ./backend/MinGramApi.csproj --configuration Release --output ./publish --no-build

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with: 
        app-name: 'minigram-api-emma'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_b0965ffbd59047b881141b7d71e10a12 }}
        package: ${{env.DOTNET_ROOT}}/myapp 
